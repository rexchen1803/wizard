<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="470" viewBox="0 0 1600 470" role="img" aria-labelledby="title desc">
<title id="title">Choose one of three Wizard installation routes</title>
<desc id="desc">An abstract route map with three equal branches for installing a package, asking an agent to help, or building from source. It is a visual index, not an interactive control.</desc>
<defs>
  <linearGradient id="route-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0C0D1B"/><stop offset="0.68" stop-color="#21152D"/><stop offset="1" stop-color="#351A3C"/></linearGradient>
  <linearGradient id="route-pink" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#F8B38E"/><stop offset="0.5" stop-color="#F7A6BE"/><stop offset="1" stop-color="#D65A98"/></linearGradient>
</defs>
<rect width="1600" height="470" fill="url(#route-bg)"/>
<text x="82" y="74" fill="#F8B38E" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="4">CHOOSE YOUR ROUTE</text>
<text x="78" y="165" textLength="670" lengthAdjust="spacingAndGlyphs" fill="#FFF9CB" font-family="Impact, 'Arial Narrow', Arial, sans-serif" font-size="90" font-weight="900">THREE WAYS IN.</text>
<path d="M800 267 C800 314 376 283 376 356 M800 267v89 M800 267 C800 314 1224 283 1224 356" fill="none" stroke="url(#route-pink)" stroke-width="5"/>
<circle cx="800" cy="255" r="18" fill="#F7A6BE"/>
<circle cx="376" cy="356" r="16" fill="#F8B38E"/>
<circle cx="800" cy="356" r="16" fill="#F7A6BE"/>
<circle cx="1224" cy="356" r="16" fill="#D65A98"/>
<path d="M376 374v33 M800 374v33 M1224 374v33" stroke="#FFF9CB" stroke-opacity="0.38" stroke-width="2"/>
<text x="376" y="433" text-anchor="middle" fill="#FFF9CB" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="3">PACKAGE</text>
<text x="800" y="433" text-anchor="middle" fill="#FFF9CB" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="3">AGENT HELP</text>
<text x="1224" y="433" text-anchor="middle" fill="#FFF9CB" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="3">SOURCE</text>
</svg>
